spring:
  application:
    name: event-hub
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    # Yerelde IDE'den çalıştırırken docker-stack'in dışarı açtığı 5433 portu kullanılır.
    # Konteyner içinde çalışırken (docker-stack ağı) DB_HOST=postgres, DB_PORT=5432 verilir.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/eventhub
    username: postgres
    password: ${DB_PASSWORD}
  security:
    user:
      name: admin
      password: ${USER_PASSWORD}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      # HTTPS arkasındaki prod ortamda COOKIE_SECURE=true verilmeli (cookie yalnızca https üzerinden gönderilir).
      cookie-secure: ${COOKIE_SECURE:false}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
